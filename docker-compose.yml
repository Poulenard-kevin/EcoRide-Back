version: '3.8'
services:
  db_ecoride:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_ecoride
      MYSQL_DATABASE: sf_EcoRide
      MYSQL_USER: kevin
      MYSQL_PASSWORD: kevin_password
    ports:
      - "3310:3306"
    volumes:
      - ecoride_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kevin", "--password=kevin_password"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s

  phpmyadmin_ecoride:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    depends_on:
      db_ecoride: 
        condition: service_healthy 
    environment:
      PMA_HOST: db_ecoride
      PMA_USER: root
      PMA_PASSWORD: rootpassword_ecoride
    volumes:
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    ports:
      - "8082:80"

  mongodb:
    image: mongo:latest
    container_name: mongodb_ecoride
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  ecoride_db_data:
  mongodb_data: