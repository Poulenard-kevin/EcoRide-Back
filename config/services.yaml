# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    App\EventListener\SessionCookieNameListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 255 }
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\OpenApi\OpenApiDecorator:
        decorates: 'api_platform.openapi.factory'
        arguments: ['@App\OpenApi\OpenApiDecorator.inner']
        autoconfigure: false
    
    App\DataPersister\UserDataPersister:
        autowire: true
        autoconfigure: true
        public: false
        # si tu veux forcer le tag (optionnel si autoconfigure=true)
        # tags: ['api_platform.data_persister']
    
    App\Api\Extension\CarOwnerExtension:
        arguments:
            - '@security.helper' 
        tags:
            - { name: 'api_platform.doctrine.orm.query_extension.collection' }
        public: false
    
    App\DataPersister\CarpoolDataPersister:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $logger: '@logger'
        tags: ['api_platform.data_persister']

    App\DataProvider\CarpoolItemDataProvider:
        arguments:
            $carpoolRepository: '@App\Repository\CarpoolRepository'
        tags:
            - { name: 'api_platform.item_data_provider', priority: 10 }

    App\DataProvider\CarpoolCollectionDataProvider:
        arguments: { $carpoolRepository: '@App\Repository\CarpoolRepository' }
        tags:
            - { name: 'api_platform.collection_data_provider', priority: 10 }
    
    App\DataPersister\BookingDataPersister:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $security: '@security.helper'
            $requestStack: '@request_stack'
            $logger: '@logger'
        tags: ['api_platform.data_persister']
        public: false

    App\EventSubscriber\CarpoolStatusSubscriber:
        public: true
        tags:
            - { name: doctrine.event_subscriber }

    App\DataPersister\ReviewDataPersister:
        autowire: true
        autoconfigure: true
        public: false
