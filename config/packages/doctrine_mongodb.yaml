doctrine_mongodb:
    auto_generate_proxy_classes: true
    auto_generate_hydrator_classes: true
    connections:
        default:
            # On écrit l'URL directement ici, sans %env%
            server: "mongodb://127.0.0.1:27017"
            options: {}
    default_database: "sf_EcoRide_mongo"
    document_managers:
        default:
            auto_mapping: true
            mappings:
                App:
                    is_bundle: false
                    type: attribute
                    dir: '%kernel.project_dir%/src/Document'
                    prefix: 'App\Document'
                    alias: App