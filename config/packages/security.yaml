security:
    enable_authenticator_manager: true

    role_hierarchy:
        ROLE_EMPLOYE: ROLE_USER
        ROLE_ADMIN: [ROLE_EMPLOYE, ROLE_USER]

    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:

        # Profiler, assets, debug
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # API stateless avec API TOKEN
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator

        # Application web (CRUD + login + CSRF)
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                csrf_parameter: _csrf_token
                csrf_token_id: authenticate
                default_target_path: /
                always_use_default_target_path: false

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:

        # --- ROUTES PUBLIQUES API ---
        - { path: ^/api/users$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs.jsonld, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs.json, roles: PUBLIC_ACCESS }     # optionnel
        - { path: ^/api$, roles: PUBLIC_ACCESS }              # <-- IMPORTANT : permet l'UI /api (Swagger UI)
        - { path: ^/api/, roles: PUBLIC_ACCESS }              # <-- autorise /api/ and children used by the UI (optionnel si nécessaire)

        # --- ROUTES PUBLIQUES SITE WEB ---
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/create-users$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }

        # --- RÈGLES API protégées ---
        - { path: ^/api/users$, methods: [GET], roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }   # Tout le reste de l'API = besoin d'être connecté

        # --- ESPACE ADMIN ---
        - { path: ^/admin, roles: ROLE_ADMIN }

        # --- ESPACE EMPLOYÉ ---
        - { path: ^/employe, roles: ROLE_EMPLOYE }

        # --- ESPACE USER (CRUD sécurisé) ---
        - { path: ^/(user|carpool|booking|car|review), roles: ROLE_USER }