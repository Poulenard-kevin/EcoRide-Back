security:

    role_hierarchy:
        ROLE_EMPLOYE: ROLE_USER
        ROLE_ADMIN: [ROLE_EMPLOYE, ROLE_USER]

    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            pattern: ^/
            anonymous: lazy
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                csrf_token_generator: security.csrf.token_manager
                default_target_path: /
                always_use_default_target_path: false

            logout:
                path: app_logout
                target: app_login

    access_control:
        # Routes publiques (accessibles sans authentification)
        - { path: ^/$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/login$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/register$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/reset-password, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/create-users$, roles: IS_AUTHENTICATED_ANONYMOUSLY }

        # Routes admin (protégées)
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Routes employé
        - { path: ^/employe, roles: ROLE_EMPLOYE }

        # Routes utilisateur
        - { path: ^/user, roles: ROLE_USER }
        - { path: ^/carpool, roles: ROLE_USER }
        - { path: ^/booking, roles: ROLE_USER }
        - { path: ^/car, roles: ROLE_USER }

        # Règle par défaut (à placer en dernier)
        - { path: ^/, roles: ROLE_USER }